# Dependabot keeps GitHub Actions and Python dependencies up to date.
# PRs for the pip ecosystem are opened against uv.lock / pyproject.toml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
