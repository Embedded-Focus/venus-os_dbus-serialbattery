name: Pre-release

on:
  push:
    tags:
      # only match pre release
      # matches:
      # v1.0.20230507-alpha
      # v1.0.20230507-beta
      # v1.0.20230507-development
      # v1.0.20230507-rc1
      - "v[0-9]+.[0-9]+.[0-9]+-?[a-zA-Z]*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Replace version string
        run: |
          echo $GITHUB_REF_NAME
          VERSION=$(echo $GITHUB_REF_NAME | sed 's/^v//')
          echo $VERSION
          echo
          grep -n "DRIVER_VERSION: str = " dbus-serialbattery/utils.py
          sed -i --regexp-extended --expression="s/[0-9]+\.[0-9]+\.[0-9a-z\_\-]+/$VERSION/" "dbus-serialbattery/utils.py"
          grep -n "DRIVER_VERSION: str = " dbus-serialbattery/utils.py
          echo
          # keep pyproject.toml in sync
          grep -n '^version' pyproject.toml
          sed -i -E "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          grep -n '^version' pyproject.toml

      - name: Copy changelog
        run: |
          cp CHANGELOG.md dbus-serialbattery/

      - name: Build release archive
        run: |
          find . -type f -name "*.py" -exec chmod +x {} \;
          find . -type f -name "*.sh" -exec chmod +x {} \;
          find . -type f -name "run" -exec chmod +x {} \;
          tar -czvf venus-data.tar.gz \
            --mode='a+rwX' \
            --exclude __pycache__ \
            --exclude bms/battery_template.py \
            --exclude bms/revov.py \
            --exclude bms/test_max17853.py \
            dbus-serialbattery/ \
            rc/

      - name: Install uv
        # v10.3.3
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Generate checksum and SBOM for the release artifact
        run: |
          sha256sum venus-data.tar.gz > venus-data.tar.gz.sha256
          uv export --format cyclonedx1.5 --no-dev -o venus-data.tar.gz.cdx.json

      - name: Release
        # v3.0.3
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231
        with:
          files: |
            venus-data.tar.gz
            venus-data.tar.gz.sha256
            venus-data.tar.gz.cdx.json
          prerelease: true
