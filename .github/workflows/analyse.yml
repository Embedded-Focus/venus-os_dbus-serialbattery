name: "CodeQL, ruff, ty checks, and tests"

on:
  push:
    # Run on all branches
    branches:
      - '**'
  pull_request:
    # Run on all branches
    branches:
      - '**'
  # Allow a manual run from the Actions tab
  workflow_dispatch:

# The CodeQL job needs to upload its results to code scanning. All other
# jobs only read the repository.
permissions:
  contents: read

jobs:
  analyse:
    name: Analyze using GitHub CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Python environment
      # v7.1.0
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.12"

    - name: Initialize CodeQL
      # v4.39.1
      uses: github/codeql-action/init@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d
      with:
        languages: python

    - name: Perform CodeQL Analysis
      # v4.39.1
      uses: github/codeql-action/analyze@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d

  lint:
    name: Lint (ruff check + ruff format)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install uv
      # v10.3.3
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

    - name: Install dependencies
      # Fails if uv.lock is not up to date with pyproject.toml
      run: uv sync --locked

    - name: Run ruff check
      run: uv run ruff check .

    - name: Run ruff format check
      run: uv run ruff format --check .

  audit:
    name: Audit dependencies (uv audit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install uv
      # v10.3.3
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

    - name: Run uv audit
      # --preview-features audit-command silences the experimental feature warning
      run: uv audit --locked --preview-features audit-command

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      # v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install uv
      # v10.3.3
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

    - name: Install dependencies
      # Fails if uv.lock is not up to date with pyproject.toml
      run: uv sync --locked

    - name: Run tests
      run: uv run pytest
